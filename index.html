        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        #panorama { width: 100vw; height: 100vh; transform: translateZ(0); will-change: transform; position: relative; }

        /* ================= HILANGKAN WATERMARK & BINTIK BAWAAN ================= */
        .pnlm-panorama-info { display: none !important; } 
        .pnlm-hotspot-base { background-color: transparent !important; border-radius: 0 !important; }
        .pnlm-hotspot { background: none !important; }
        .pnlm-tooltip { display: none !important; }
        .pnlm-about-dialog { display: none !important; }

        /* ================= LOADING PROGRESS (EFEK KACA PUTIH) ================= */
        .pnlm-load-box p, .pnlm-lbox { display: none !important; }
        .pnlm-load-box {
            background: rgba(255, 255, 255, 0.25) !important;
            backdrop-filter: blur(8px) !important; -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            border-radius: 12px !important;
            position: fixed !important; top: 50% !important; left: 50% !important; 
            transform: translate(-50%, -50%) !important;
            width: 150px !important; height: 8px !important; 
            padding: 3px !important; margin: 0 !important; z-index: 999999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2) !important; pointer-events: none;
        }
        .pnlm-progressbar {
            position: relative !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important; border-radius: 8px !important;
            background: rgba(0, 0, 0, 0.1) !important; overflow: hidden !important;
            border: none !important; margin: 0 !important;
        }
        .pnlm-progressbar-fill {
            background: #ffffff !important; height: 100% !important; border-radius: 8px !important;
            box-shadow: 0 0 10px rgba(255,255,255,0.8) !important;
        }

        /* ================= KONTROL (+, -, Fullscreen, Gyro) TATA LETAK SANGAT PRESISI ================= */
        /* Menghilangkan bungkus transparan agar bisa dibentuk terpisah-pisah */
        .pnlm-controls {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            margin: 0 !important; padding: 0 !important;
        }

        /* Desain Kaca Putih untuk SEMUA Ikon Bawaan */
        .pnlm-control {
            background-color: rgba(255, 255, 255, 0.4) !important; /* Latar kaca keputihan */
            backdrop-filter: blur(8px) !important; -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.7) !important;
            border-radius: 6px !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2) !important;
            width: 26px !important; height: 26px !important; /* Ukuran ini wajib agar Ikon hitam muncul */
            position: absolute !important;
            box-sizing: content-box !important;
            transition: all 0.2s ease !important;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }
        .pnlm-control:hover { background-color: rgba(255, 255, 255, 0.6) !important; }

        /* Koordinat pasti berjejer ke bawah (Jarak antar ikon persis 8px) */
        .pnlm-zoom-controls { top: 20px !important; left: 20px !important; width: 26px !important; height: 60px !important; }
        .pnlm-zoom-in { top: 0 !important; left: 0 !important; }
        .pnlm-zoom-out { top: 34px !important; left: 0 !important; } /* 26px + jarak 8px = 34px */

        .pnlm-fullscreen-controls { top: 88px !important; left: 20px !important; width: 26px !important; height: 26px !important; right: auto !important; }
        .pnlm-fullscreen-toggle-button { top: 0 !important; left: 0 !important; }

        .pnlm-orientation-controls { top: 122px !important; left: 20px !important; width: 26px !important; height: 26px !important; right: auto !important; }
        .pnlm-orientation-button { top: 0 !important; left: 0 !important; }

        .custom-card.show { display: block; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popUp { from { opacity: 0; transform: translateY(10px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

    </style>

// MEMASTIKAN TOMBOL MUSIK & WATERMARK TIDAK HILANG SAAT FULLSCREEN
setTimeout(function() {
    var pnlmContainer = document.querySelector('.pnlm-container');
    pnlmContainer.appendChild(document.getElementById('music-btn'));
    pnlmContainer.appendChild(document.getElementById('watermark'));
}, 500);

// ================= LOGIKA MUSIK =================
var music = document.getElementById("bg-music");
var musicBtn = document.getElementById("music-btn");
var musicIcon = document.getElementById("music-icon");
var isPlaying = false;

musicBtn.addEventListener("click", function() {
    if (isPlaying) {
        music.pause();
        musicIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>'; 
        isPlaying = false;
    } else {
        music.play();
        musicIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>'; 
        isPlaying = true;
    }
});

// ================= LOGIKA WATERMARK MUNCUL SAAT FULLSCREEN =================
var watermarkDiv = document.getElementById('watermark');

function checkFullscreen() {
    var isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    if(isFullscreen) {
        watermarkDiv.style.display = 'block'; 
    } else {
        watermarkDiv.style.display = 'none';  
    }
}

document.addEventListener('fullscreenchange', checkFullscreen);
document.addEventListener('webkitfullscreenchange', checkFullscreen);
document.addEventListener('mozfullscreenchange', checkFullscreen);
document.addEventListener('MSFullscreenChange', checkFullscreen);

// ================= LOGIKA BUKU TAMU =================
window.onload = function() {
    document.getElementById('guestbook-modal').style.display = 'flex';
};

function closeGuestbook() {
    document.getElementById('guestbook-modal').style.display = 'none';
}

function submitGuestbook(event) {
    event.preventDefault(); 
    var btn = document.getElementById('gb-btn');
    var nama = document.getElementById('gb-nama').value;
    btn.innerHTML = 'Memuat...';
    
    fetch("https://formsubmit.co/ajax/ptmediatulisanmanusia@gmail.com", {
        method: "POST",
        headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({
            _subject: "Pengunjung-Virtual",
            Nama: nama
        })
    })
    .then(response => response.json())
    .then(data => {
        btn.innerHTML = 'Selamat Datang!';
        setTimeout(closeGuestbook, 800);
    })
    .catch(error => {
        btn.innerHTML = 'Selamat Datang!';
        setTimeout(closeGuestbook, 800);
    });
}

// ================= LOGIKA WEB POP-UP =================
function openWebModal(url) {
    document.getElementById("web-iframe").src = url;
    document.getElementById("web-modal").style.display = "flex";
}
function closeWebModal() {
    document.getElementById("web-modal").style.display = "none";
    document.getElementById("web-iframe").src = "";
}

// ================= FUNGSI IKON PANNELLUM UMUM =================
function customMsgTooltip(hotSpotDiv, args) {
    hotSpotDiv.style.width = '45px'; hotSpotDiv.style.height = '45px'; 
    hotSpotDiv.style.pointerEvents = 'none'; hotSpotDiv.style.display = 'flex'; hotSpotDiv.style.justifyContent = 'center';

    var iconBtn = document.createElement('div');
    iconBtn.className = 'clean-icon-box icon-glow';
    iconBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
    iconBtn.innerHTML += '<div class="icon-label">Info</div>'; 

    var cardDiv = document.createElement('div');
    cardDiv.className = 'custom-card';
    cardDiv.innerHTML = "<span class='close-card'>&times;</span>" + args;

    iconBtn.onclick = function(e) {
        document.querySelectorAll('.custom-card').forEach(c => { if(c !== cardDiv) c.classList.remove('show'); });
        cardDiv.classList.toggle('show'); e.stopPropagation();
    };
    cardDiv.querySelector('.close-card').onclick = function(e) { cardDiv.classList.remove('show'); e.stopPropagation(); };
    cardDiv.onmousedown = function(e) { e.stopPropagation(); }; cardDiv.ontouchstart = function(e) { e.stopPropagation(); };

    hotSpotDiv.appendChild(iconBtn);
    hotSpotDiv.appendChild(cardDiv);
}

function customArrowTooltip(hotSpotDiv, label) {
    hotSpotDiv.style.width = '45px'; hotSpotDiv.style.height = '45px'; 
    hotSpotDiv.style.pointerEvents = 'none'; hotSpotDiv.style.display = 'flex'; hotSpotDiv.style.justifyContent = 'center';
    
    var arrowBtn = document.createElement('div');
    arrowBtn.className = 'clean-icon-box icon-arrow-up';
    arrowBtn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
    if(label) { arrowBtn.innerHTML += '<div class="icon-label">' + label + '</div>'; }
    
    hotSpotDiv.appendChild(arrowBtn);
}

function customDoorTooltip(hotSpotDiv, label) {
    hotSpotDiv.style.width = '45px'; hotSpotDiv.style.height = '45px'; 
    hotSpotDiv.style.pointerEvents = 'none'; hotSpotDiv.style.display = 'flex'; hotSpotDiv.style.justifyContent = 'center';
    
    var doorBtn = document.createElement('div');
    doorBtn.className = 'clean-icon-box icon-glow';
    doorBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 20V5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v15"></path><path d="M2 20h20"></path><path d="M14 12v.01"></path></svg>';
    if(label) { doorBtn.innerHTML += '<div class="icon-label">' + label + '</div>'; }
    
    hotSpotDiv.appendChild(doorBtn);
}

// ================= FUNGSI LAYAR MONITOR =================
function customMonitorScreen(hotSpotDiv, label) {
    hotSpotDiv.style.width = '260px'; 
    hotSpotDiv.style.height = '145px'; 
    
    var overlay = document.createElement('div');
    overlay.className = 'monitor-overlay';
    
    var text = document.createElement('div');
    text.className = 'monitor-text';
    text.innerHTML = label || 'Buka Layar';
    
    overlay.appendChild(text);
    overlay.onclick = function() { openWebModal("https://mediatulisanmanusia.online"); };
    
    hotSpotDiv.appendChild(overlay);
}
